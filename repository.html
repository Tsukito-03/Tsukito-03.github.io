<!doctype html>
<html lang="th" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repository - My Fridge</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "Prompt", "sans-serif"] },
            colors: {
              black: "#121212",
              white: "#ffffff",
              gray: {
                100: "#f5f5f5",
                200: "#eeeeee",
                300: "#e0e0e0",
                400: "#bdbdbd",
                500: "#9e9e9e",
                600: "#757575",
                700: "#616161",
                800: "#424242",
                900: "#212121",
              }
            },
            boxShadow: {
              card: "0 2px 10px rgba(0, 0, 0, 0.05)",
              dark: "0 4px 20px rgba(255, 255, 255, 0.05)",
            }
          }
        }
      };
    </script>
    <style>
      * { box-sizing: border-box; }
      body { transition: background-color 0.3s, color 0.3s; }
      .food-image { transition: transform 0.5s ease; filter: grayscale(20%); }
      .food-card:hover .food-image { transform: scale(1.05); filter: grayscale(0%); }
    </style>
  </head>

  <body class="bg-white text-black dark:bg-black dark:text-white min-h-screen">

    <!-- ==========================================
       NAVIGATION BAR
    =========================================== -->
    <nav class="fixed top-0 w-full bg-white/90 dark:bg-black/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 z-40">
      <div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
        <a href="index.html" class="font-bold text-xl tracking-tighter hover:text-gray-500 transition">
          ← FRIDGE.
        </a>
        <span class="text-sm font-medium text-gray-500">Recipe Repository</span>
      </div>
    </nav>

    <!-- ==========================================
       REPOSITORY CONTENT
    =========================================== -->
    <main class="max-w-7xl mx-auto px-5 pt-32 pb-20">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b border-gray-200 dark:border-gray-800 pb-4">
        <div>
          <h1 class="text-3xl font-bold tracking-tight mb-1">📚 คลังเมนูทั้งหมด</h1>
          <p class="text-gray-500 dark:text-gray-400 text-sm">รวมสูตรอาหารทั้งหมดที่มีในระบบ</p>
        </div>
        
        <!-- Category Filters -->
        <div id="categoryFilters" class="flex gap-2 overflow-x-auto hide-scrollbar text-sm">
          <button onclick="filterCategory('All')" class="category-btn px-4 py-1.5 rounded-full bg-black text-white dark:bg-white dark:text-black transition">ทั้งหมด</button>
          <button onclick="filterCategory('Healthy')" class="category-btn px-4 py-1.5 rounded-full border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 transition">สุขภาพ</button>
          <button onclick="filterCategory('Traditional')" class="category-btn px-4 py-1.5 rounded-full border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 transition">ดั้งเดิม</button>
          <button onclick="filterCategory('Quick Meal')" class="category-btn px-4 py-1.5 rounded-full border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 transition">จานด่วน</button>
        </div>
      </div>

      <!-- Grid of Recipes -->
      <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- JS rendered -->
      </div>

    </main>

    <!-- Script for rendering data -->
    <script>
      const recipes = [
        {
          id: 1, name: "กะเพราไก่ไข่ดาว", category: "Traditional",
          description: "เมนูยอดฮิต ทำง่าย หอมใบกะเพรา เผ็ดกำลังดี",
          image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=600&q=80",
          ingredients: ["อกไก่", "ใบกะเพรา", "กระเทียม", "พริก", "ไข่", "น้ำปลา"],
          steps: ["โขลกกระเทียมและพริก", "ผัดพริกกระเทียมกับไก่จนสุก", "ปรุงรส ใส่ใบกะเพรา", "เสิร์ฟพร้อมไข่ดาว"]
        },
        {
          id: 2, name: "ข้าวผัดไข่หมูสับ", category: "Quick Meal",
          description: "ข้าวผัดร้อนๆ อร่อย ทำง่าย รวดเร็ว",
          image: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=600&q=80",
          ingredients: ["หมูสับ", "ไข่", "ข้าวสวย", "กระเทียม", "ต้นหอม", "ซีอิ๊ว"],
          steps: ["เจียวกระเทียม", "ใส่หมูและไข่ผัดให้สุก", "ใส่ข้าวสวยและซีอิ๊วผัดให้เข้ากัน"]
        },
        {
          id: 3, name: "ผัดมะเขือเทศใส่ไข่", category: "Healthy",
          description: "เมนูสุขภาพ รสชาติเปรี้ยวหวานกลมกล่อม",
          image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80",
          ingredients: ["ไข่", "มะเขือเทศ", "กระเทียม", "ต้นหอม"],
          steps: ["ผัดไข่พอสุกแล้วตักขึ้น", "ผัดมะเขือเทศกับกระเทียม", "นำไข่ลงมาผัดรวมกัน ปรุงรส"]
        },
        {
          id: 4, name: "ต้มจืดเต้าหู้หมูสับ", category: "Healthy",
          description: "ซุปร้อนๆ ซดคล่องคอ มีประโยชน์",
          image: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=600&q=80",
          ingredients: ["หมูสับ", "เต้าหู้", "ผักกาดขาว", "กระเทียม", "พริกไทย"],
          steps: ["ต้มน้ำให้เดือด ใส่หมูสับปั้นก้อน", "ใส่เต้าหู้และผักกาดขาว", "ปรุงรสด้วยซีอิ๊วและพริกไทย"]
        }
      ];

      let currentCategory = 'All';

      function filterCategory(cat) {
        currentCategory = cat;
        updateButtons();
        renderRecipes();
      }

      function updateButtons() {
        document.querySelectorAll('.category-btn').forEach(btn => {
          if(btn.innerText.includes(currentCategory === 'All' ? 'ทั้งหมด' : currentCategory)) {
            btn.className = "category-btn px-4 py-1.5 rounded-full bg-black text-white dark:bg-white dark:text-black transition";
          } else {
            btn.className = "category-btn px-4 py-1.5 rounded-full border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 transition";
          }
        });
      }

      function renderRecipes() {
        const grid = document.getElementById('recipeGrid');
        grid.innerHTML = "";
        
        let list = recipes;
        if(currentCategory !== 'All') {
          list = recipes.filter(r => r.category === currentCategory);
        }

        list.forEach(recipe => {
          grid.innerHTML += `
            <div class="food-card bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl overflow-hidden shadow-card dark:shadow-dark transition-all">
              <div class="h-40 overflow-hidden relative">
                <img src="${recipe.image}" class="food-image w-full h-full object-cover">
                <span class="absolute top-3 left-3 text-[10px] uppercase tracking-wider font-bold bg-white dark:bg-black px-2 py-1 rounded shadow-sm">
                  ${recipe.category}
                </span>
              </div>
              <div class="p-4">
                <h3 class="font-bold text-lg mb-1 truncate">${recipe.name}</h3>
                <p class="text-xs text-gray-500 line-clamp-2">${recipe.description}</p>
              </div>
            </div>
          `;
        });
      }

      renderRecipes();
    </script>
  </body>
</html>
